name: Update README preview

on:
  push:
    branches:
      - main
    paths:
      - "src/contribution_focus/**"
      - "examples/generate_preview.py"
      - ".github/workflows/update-preview.yml"

permissions:
  contents: write

concurrency:
  group: update-readme-preview
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Regenerate preview
        run: python examples/generate_preview.py

      - name: Commit updated preview
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- examples/preview.svg; then
            echo "Preview is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/preview.svg
          git commit -m "Update README preview"
          git pull --rebase origin main
          git push origin HEAD:main
